{% extends "base/base_base.html" %}
{% block content %}
<h2>Roles</h2>
<a href="{% url 'accounts:role_create' %}">Crear nuevo rol</a>
<table border="1" cellpadding="6">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for role in roles %}
        <tr>
            <td>{{ role.name }}</td>
            <td>{{ role.description }}</td>
            <td>
                <a href="{% url 'accounts:role_edit' role.id %}">Editar</a> |
                <a href="{% url 'accounts:role_delete' role.id %}">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
