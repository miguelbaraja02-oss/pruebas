{% extends "base/base_base.html" %}
{% block content %}
<h2>Eliminar rol</h2>
<p>¿Seguro que quieres eliminar el rol "{{ role.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>
<a href="{% url 'accounts:roles_list' %}">Cancelar</a>
{% endblock %}
