{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --upec-green: #006633;
            --upec-dark: #004d26;
            --upec-gold: #ffce00;
        }

        body {
            /* Degradado elegante en lugar de color plano */
            background: linear-gradient(135deg, var(--upec-green) 0%, #00331a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px; /* Espacio de seguridad en bordes de móvil */
        }

        /* --- CONTENEDOR DE LOGIN (TARJETA) --- */
        .login-container {
            background: rgba(255, 255, 255, 0.95); /* Ligeramente translúcido */
            backdrop-filter: blur(10px); /* Efecto cristal suave */
            border-radius: 16px; /* Bordes más redondeados estilo App */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            transition: all 0.3s ease;
        }

        .login-container h2 {
            color: var(--upec-green);
            margin-bottom: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .login-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* --- LOGO --- */
        .login-logo {
            display: block;
            margin: 0 auto 10px auto;
            max-width: 180px; /* Tamaño controlado */
            height: auto;
            transition: filter 0.3s ease;
        }

        /* --- INPUTS FLOTANTES MODERNOS --- */
        .form-floating > .form-control {
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }
        
        .form-floating > .form-control:focus {
            border-color: var(--upec-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 102, 51, 0.15);
            background-color: #fff;
        }

        .form-floating > label {
            color: #888;
        }


        /* --- BOTÓN PRO --- */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--upec-gold), #ffdb4d);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 206, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* --- LINKS Y CHECKBOX --- */
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
        }
        .register-link a {
            color: var(--upec-green);
            text-decoration: none;
            font-weight: 700;
        }

        .form-check-input:checked {
            background-color: var(--upec-green);
            border-color: var(--upec-green);
        }

        /* =========================================
           OPTIMIZACIÓN MÓVIL (MEDIA QUERY)
           ========================================= */
        @media (max-width: 576px) {
            body {
                padding: 0; /* Pantalla completa en móvil */
                align-items: flex-start; /* Subir contenido si aparece teclado */
            }

            .login-container {
                height: 100vh; /* Ocupar toda la altura */
                border-radius: 0; /* Sin bordes redondeados en full screen */
                display: flex;
                flex-direction: column;
                justify-content: center;
                box-shadow: none;
                padding: 30px 25px; /* Padding más cómodo para dedos */
            }

            .login-logo {
                max-width: 150px; /* Logo más pequeño en móvil */
                margin-bottom: 5px;
            }

            .login-container h2 {
                font-size: 1.5rem;
            }

            /* Ajuste para que el teclado no tape el input */
            .btn-login {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <img src="{% static 'accounts/logoV.svg' %}" alt="Logo" class="login-logo">
    
    <h2>Bienvenido</h2>
    <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

    {% if login_error %}
        <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert" style="border-radius: 10px; font-size: 0.9rem;">
            <i class="fa-solid fa-circle-exclamation me-2"></i> {{ login_error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endif %}

    <form method="post" id="loginForm">
        {% csrf_token %}

        <div class="form-floating mb-3">
            <input type="text" name="username" id="username" class="form-control" placeholder="Usuario" required>
            <label for="username"><i class="fa-solid fa-user me-2"></i>Usuario</label>
        </div>

        <div class="form-floating mb-3">
            <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required>
            <label for="password"><i class="fa-solid fa-lock me-2"></i>Contraseña</label>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberCreds">
                <label class="form-check-label small" for="rememberCreds">
                    Recordarme
                </label>
            </div>
            <a href="#" class="small text-decoration-none text-muted">¿Olvidaste la clave?</a>
        </div>

        <button type="submit" class="btn btn-login">
            INGRESAR <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
    </form>

    <div class="register-link">
        <span class="text-muted">¿Nuevo en el sistema?</span><br>
        <a href="{% url 'accounts:register' %}">Crear una cuenta</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const loginForm = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const rememberCheck = document.getElementById('rememberCreds');

    // Lógica de Recordar Usuario
    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('cachedUsername');
        const savedPass = localStorage.getItem('cachedPassword');
        const shouldRemember = localStorage.getItem('shouldRemember') === 'true';

        if (shouldRemember && savedUser) {
            userInput.value = savedUser;
            rememberCheck.checked = true;
            if (savedPass) passInput.value = savedPass;
        }

    });

    loginForm.addEventListener('submit', () => {
        if (rememberCheck.checked) {
            localStorage.setItem('cachedUsername', userInput.value);
            localStorage.setItem('cachedPassword', passInput.value);
            localStorage.setItem('shouldRemember', 'true');
        } else {
            localStorage.removeItem('cachedUsername');
            localStorage.removeItem('cachedPassword');
            localStorage.setItem('shouldRemember', 'false');
        }
    });

</script>

</body>
</html>
