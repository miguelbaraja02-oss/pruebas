{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #006633;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s ease;
        }
        body.dark-mode {
            background: #1a1a1a;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body.dark-mode .login-container {
            background: #2d2d2d;
            color: #f0f0f0;
        }
        .login-container h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        body.dark-mode .login-container h2 {
            color: #f0f0f0;
        }
        
        /* --- ESTILOS DEL LOGO MODIFICADOS --- */
        .login-logo {
            display: block;
            margin: 0 auto 30px auto;
            max-width: 260px;
            width: 100%;
            height: auto;
            /* Agregamos transición para que el cambio de color sea suave */
            transition: filter 0.3s ease; 
        }

        /* Esta es la regla mágica: invierte los colores de la imagen en modo oscuro */
        body.dark-mode .login-logo {
            filter: invert(1);
        }
        /* ------------------------------------ */

        .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 12px 15px;
            margin-bottom: 15px;
        }
        body.dark-mode .form-control {
            background: #3d3d3d;
            color: #f0f0f0;
            border-color: #555;
        }
        .form-check {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .form-check-label {
            margin-left: 10px;
            font-size: 0.9rem;
            color: #666;
        }
        body.dark-mode .form-check-label {
            color: #ccc;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #ffce00;
            color: #333;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            margin-top: 10px;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        body.dark-mode .register-link a {
            color: #ffce00;
        }
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffce00;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }
        body.dark-mode .dark-mode-toggle {
            background: #333;
            color: #ffce00;
        }
    </style>
</head>

<body>

<button class="dark-mode-toggle" id="darkModeBtn">🌙</button>

<div class="login-container">

    <h2>Iniciar Sesión</h2>

        <img src="{% static 'accounts/logoV.svg' %}" alt="Logo de la empresa" class="login-logo">

    {% if login_error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ login_error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endif %}

    <form method="post" id="loginForm">
        {% csrf_token %}

        <input type="text" name="username" id="username"
               placeholder="Usuario" class="form-control" required>

        <input type="password" name="password" id="password"
               placeholder="Contraseña" class="form-control" required>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberCreds">
            <label class="form-check-label" for="rememberCreds">
                Recordar credenciales
            </label>
        </div>

        <button type="submit" class="btn btn-login">Entrar</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta?
        <a href="{% url 'accounts:register' %}">Regístrate aquí</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const loginForm = document.getElementById('loginForm');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const rememberCheck = document.getElementById('rememberCreds');

    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('cachedUsername');
        const savedPass = localStorage.getItem('cachedPassword');
        const shouldRemember = localStorage.getItem('shouldRemember') === 'true';

        if (shouldRemember && savedUser) {
            userInput.value = savedUser;
            rememberCheck.checked = true;
            if (savedPass) passInput.value = savedPass;
        }
    });

    loginForm.addEventListener('submit', () => {
        if (rememberCheck.checked) {
            localStorage.setItem('cachedUsername', userInput.value);
            localStorage.setItem('cachedPassword', passInput.value);
            localStorage.setItem('shouldRemember', 'true');
        } else {
            localStorage.clear();
        }
    });

    const darkModeBtn = document.getElementById('darkModeBtn');
    const isDarkMode = localStorage.getItem('darkMode') === 'true';

    if (isDarkMode) {
        document.body.classList.add('dark-mode');
        darkModeBtn.textContent = '☀️';
    }

    darkModeBtn.addEventListener('click', () => {
        const enabled = document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', enabled);
        darkModeBtn.textContent = enabled ? '☀️' : '🌙';
    });
</script>

</body>
</html>
